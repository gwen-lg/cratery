name: "Build Native and Push Digest"
description: "Builds a docker image for a specific arch, extracts the digest, pushes it, and cleans up."
inputs:
  tag:
    description: "Fullname of image to push"
    required: true
  arch:
    description: "Target architecture (amd64 or arm64)"
    required: true
outputs:
  digest:
    description: "The SHA256 digest of the pushed image"
    value: ${{ steps.build.outputs.digest }}

runs:
  using: "composite"
  steps:
    - name: Get Git commit timestamps
      shell: bash
      run: echo "TIMESTAMP=$(git log -1 --pretty=%ct)" >> $GITHUB_ENV
    - uses: docker/setup-buildx-action@v4
    - name: Build and Push Image ${{ inputs.arch }}
      id: build
      uses: docker/build-push-action@v5
      with:
        platforms: linux/${{ inputs.arch }}
        push: true
        tags: ${{ inputs.tag }}:build-${{ inputs.arch }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          SOURCE_DATE_EPOCH=${{ env.TIMESTAMP }}
