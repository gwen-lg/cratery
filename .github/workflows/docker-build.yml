# Required configuration for forks:
# To enable Docker builds, configure the following in "Settings > Secrets and variables > Actions":
# - ENABLE_DOCKER_BUILD (Variable): Set to "true"
# - DOCKERHUB_USERNAME (Variable): Your Docker Hub username
# - DOCKERHUB_TOKEN (Secret): Your Docker Hub personal access token

name: Docker Build and Push

on:
  push:
    tags:
      - "v*"
    branches:
      - "main"
      - "docker_image_github_build" # WIP: TODO: remove
  workflow_dispatch:
    inputs:
      build_target:
        description: "Build target"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug
      platforms:
        description: "Target platforms"
        required: true
        default: "linux/amd64,linux/arm64"
        type: choice
        options:
          - linux/amd64
          - linux/arm64
          - linux/amd64,linux/arm64

jobs:
  build-image-amd64:
    if: vars.ENABLE_DOCKER_BUILD == 'true'
    runs-on: ubuntu-26.04
    outputs:
      digest: ${{ steps.build_native_amd64.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - name: Get Git commit timestamps
        run: echo "TIMESTAMP=$(git log -1 --pretty=%ct)" >> $GITHUB_ENV
      - name: login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to Github docker Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build native amd64
        id: build_native_amd64
        uses: ./.github/actions/build-native-digest
        env:
          SOURCE_DATE_EPOCH: ${{ env.TIMESTAMP }}
        with:
          tag: ${{ vars.DOCKERHUB_USERNAME }}/cratery
          arch: amd64

  build-image-arm64:
    if: vars.ENABLE_DOCKER_BUILD == 'true'
    runs-on: ubuntu-26.04-arm
    outputs:
      digest: ${{ steps.build_native_arm64.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - name: Get Git commit timestamps
        run: echo "TIMESTAMP=$(git log -1 --pretty=%ct)" >> $GITHUB_ENV
      - name: login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to Github docker Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build native arm64
        id: build_native_arm64
        uses: ./.github/actions/build-native-digest
        env:
          SOURCE_DATE_EPOCH: ${{ env.TIMESTAMP }}
        with:
          tag: ${{ vars.DOCKERHUB_USERNAME }}/cratery
          arch: arm64

  create-manifest:
    if: vars.ENABLE_DOCKER_BUILD == 'true'
    needs: [build-image-amd64, build-image-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: login to Github docker registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Manifest from Digests
        # env:
        #   DOCKERHUB_USERNAME: "${{ vars.DOCKERHUB_USERNAME }}"
        run: |
          # DockerHub
          docker manifest create ${{ vars.DOCKERHUB_USERNAME }}/cratery:ghbuild \
            ${{ vars.DOCKERHUB_USERNAME }}/cratery@${{ needs.build-image-amd64.outputs.digest }} \
            ${{ vars.DOCKERHUB_USERNAME }}/cratery@${{ needs.build-image-arm64.outputs.digest }}
          docker manifest push ${{ vars.DOCKERHUB_USERNAME }}/cratery:ghbuild
          # GitHub
          docker manifest create ghcr.io/${{ github.actor }}/cratery:ghbuild \
            ghcr.io/${{ github.actor }}/cratery@${{ needs.build-image-amd64.outputs.digest }} \
            ghcr.io/${{ github.actor }}/cratery@${{ needs.build-image-arm64.outputs.digest }}
          docker manifest push ghcr.io/${{ github.actor }}/cratery:ghbuild

      # - name: Create and Push Versioned Manifest
      #   if: github.ref_type == 'tag'
      #   env:
      #     DOCKERHUB_USERNAME: "${{ vars.DOCKERHUB_USERNAME }}"
      #   run: |
      #     TAG_NAME="${{ github.ref_name }}"
      #     docker manifest create ${{ vars.DOCKERHUB_USERNAME }}/cratery:$TAG_NAME \
      #       ${{ vars.DOCKERHUB_USERNAME }}/cratery:${{ needs.build-image-amd64.outputs.digest }} \
      #       ${{ vars.DOCKERHUB_USERNAME }}/cratery:${{ needs.build-image-arm64.outputs.digest }}
