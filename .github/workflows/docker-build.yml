# Required configuration for forks:
# To enable Docker builds, configure the following in "Settings > Secrets and variables > Actions":
# - ENABLE_DOCKER_BUILD (Variable): Set to "true"
# - DOCKERHUB_USERNAME (Variable): Your Docker Hub username
# - DOCKERHUB_TOKEN (Secret): Your Docker Hub personal access token

name: Docker Build and Push

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Target platforms"
        required: true
        default: "linux/amd64,linux/arm64"
        type: choice
        options:
          - linux/amd64
          - linux/arm64
          - linux/amd64,linux/arm64

jobs:
  build:
    if: vars.ENABLE_DOCKER_BUILD == 'true'
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read # to fetch the repository content
      id-token: write # for signing attestations and cache entries with GitHub OIDC
      packages: write
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      platforms: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
      cache: true
      meta-images: |
        ${{ vars.DOCKERHUB_USERNAME }}/cratery
        ghcr.io/gwen-lg/cratery
      build-args: |
        BUILD_FLAGS=--release
        BUILD_TARGET=release
        BUILD_GIT_TAG=${{ github.ref_name }}
        BUILD_GIT_HASH=${{ github.sha }}
      meta-tags: |
        type=ref,event=branch
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
